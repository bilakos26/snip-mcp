[project]
name = "snip-mcp"
version = "0.3.3"
description = "Local-only MCP server for token-efficient code retrieval via tree-sitter AST parsing"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "tree-sitter-language-pack>=0.6.0",
    "pathspec>=0.12.0",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
docs = [
    "openpyxl>=3.1",
    "python-docx>=1.0",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
]
watch = ["watchfiles>=0.21"]
all = ["snip-mcp[tokens,docs,watch]"]

[project.scripts]
snip-mcp = "snip_mcp.server:main"
snip-mcp-index = "snip_mcp.cli_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
allow-insecure-host = ["pypi.org", "github.com", "files.pythonhosted.org"]
native-tls = true
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8.0"]
